<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<script src="script.js" defer></script>
		<title>Open Trivia Quiz</title>
	</head>
	<body>
		<header><h1>Open Trivia Quiz</h1></header>
		<nav class="question-nav hidden">
			<h3 class="nav-title">Questions</h3>
			<ul class="question-list">
				<li>Placeholder question navigation</li>
			</ul>
		</nav>
		<main>
			<div class="centre-content">
				<form action method="post" class="api-form">
					<h2>Quiz Selection</h2>
					<div class="num-questions-input">
						<label for="trivia_amount">Number of Questions:</label>
						<input
							type="number"
							name="trivia_amount"
							id="trivia_amount"
							class="form-control"
							min="1"
							max="50"
							value="10"
						/>
					</div>
					<label for="trivia_category">Select Category: </label>
					<select name="trivia_category" class="form-control">
						<option value="any">Any Category</option>
						<option value="9">General Knowledge</option>
						<option value="10">Entertainment: Books</option>
						<option value="11">Entertainment: Film</option>
						<option value="12">Entertainment: Music</option>
						<option value="13">Entertainment: Musicals &amp; Theatres</option>
						<option value="14">Entertainment: Television</option>
						<option value="15">Entertainment: Video Games</option>
						<option value="16">Entertainment: Board Games</option>
						<option value="17">Science &amp; Nature</option>
						<option value="18">Science: Computers</option>
						<option value="19">Science: Mathematics</option>
						<option value="20">Mythology</option>
						<option value="21">Sports</option>
						<option value="22">Geography</option>
						<option value="23">History</option>
						<option value="24">Politics</option>
						<option value="25">Art</option>
						<option value="26">Celebrities</option>
						<option value="27">Animals</option>
						<option value="28">Vehicles</option>
						<option value="29">Entertainment: Comics</option>
						<option value="30">Science: Gadgets</option>
						<option value="31">
							Entertainment: Japanese Anime &amp; Manga
						</option>
						<option value="32">Entertainment: Cartoon &amp; Animations</option>
					</select>
					<label for="trivia_difficulty">Select Difficulty: </label>
					<select name="trivia_difficulty" class="form-control">
						<option value="any">Any Difficulty</option>
						<option value="easy">Easy</option>
						<option value="medium">Medium</option>
						<option value="hard">Hard</option>
					</select>
					<label for="trivia_type">Select Type: </label>
					<select name="trivia_type" class="form-control">
						&gt;
						<option value="any">Any Type</option>
						<option value="multiple">Multiple Choice</option>
						<option value="boolean">True / False</option>
					</select>
					<button class="api-submit-btn" type="submit">Generate Quiz</button>
				</form>
				<div class="question-card hidden">
					<h2 class="question-number">Question #</h2>
					<h3 class="question-text">Question 1</h3>
					<form class="ans-opts" action="">
						<div class="ans-opts-container"></div>
						<div class="buttons">
							<button type="button" class="prev-button">
								Previous Question
							</button>
							<button type="button" class="next-button">Next Question</button>
						</div>
					</form>
				</div>
				<div class="result-card hidden">
					<h1 class="quiz-score"></h1>
					<h4>Enter a username to save quiz results.</h4>
					<input
						type="text"
						class="username-input"
						placeholder="Username"
						autocomplete="off"
					/>
					<button type="button" class="username-btn hidden">save</button>
				</div>
				<div class="quiz-actions hidden">
					<button type="button" class="action-1 add-question">
						Add Question
					</button>
					<button type="button" class="action-2 submit-quiz">
						Submit Quiz
					</button>
				</div>
			</div>
		</main>
		<aside></aside>
		<footer>
			<p>Eadan Lay<br />30120015</p>
		</footer>
	</body>
</html>
